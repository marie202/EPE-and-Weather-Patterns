  6: 2  # n_days=787, max silhouette (WARNING: no candidate k kept every cluster >= 100 days — regime has only 787 days total), UNSTABLE, mean_ari=0.01 < threshold -- consider a runner-up k, gap agrees (gap_optimal_k=2)
