# Custom K per bbox step for Europe summary PDFs (Step 9 / 10–11 file resolution).
# Copy or point K_CONFIG at this file when submitting s13 / sbatch_bbox_run_summary.
#
# Each k must match the k used when clustering was run (filenames contain kmeans_kNN).
# List on HPC, e.g.:
#   ls results/clustering/europe/09_Z500_regimes_kmeans_k*_w11_*var90*1979-2025*.nc
#
# Submit (same K_CONFIG for both — clustering must match the report's file resolution):
#   sbatch --export=ALL,K_CONFIG=src/summary_reports/k_overrides_europe_custom.yaml,... \
#     z_03_run_regime_clustering_tu_hpc.sh
#   sbatch --export=ALL,K_CONFIG=src/summary_reports/k_overrides_europe_custom.yaml,... \
#     z_04_run_regime_report_tu_hpc.sh

region: europe
default_k: 7
k_by_step:
  # NOTE: k must match an existing legacy Step-9 K-means NetCDF on disk
  # (ls results/clustering/europe/09_Z500_regimes_kmeans_k*_*_stepBx_*.nc).
  # B0 has been clustered at k=7 — change to 8 only AFTER re-running notebook
  # 09 for B0 at k=8 (otherwise the EPE supplementary step fails with
  # "No legacy Step-9 Z500 regimes NetCDF matches ... k=8").
  B0: 7  # available legacy NC: k07 (was 8 # eig 9 — see note above)
  B1: 4
  B2: 5
  B3: 5
  B4: 5
  B5: 5
